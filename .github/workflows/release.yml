# Terraform Registry release. Runs on a version tag (v*), cross-compiles and
# signs the provider with GoReleaser, and publishes a GitHub release the
# Terraform Registry ingests.
#
# This is a PUBLIC repo, so GitHub Actions standard-runner minutes are free
# (no metered cost). Actions are active again (they were paused account-wide on
# 2026-07-23, which is the day this ran on the v0.1.0 tag and failed in five
# seconds on the missing secret below; 0.1.0 was then released by running
# GoReleaser locally). This still cannot sign until these two repo secrets are
# set, and nothing else is in the way:
#   GPG_PRIVATE_KEY - the ASCII-armored private key whose PUBLIC half is
#                     registered under the TAIPANBOX namespace in the Terraform
#                     Registry's GPG settings.
#   PASSPHRASE      - that key's passphrase (omit the input if the key has none).
# See README.md "Publishing a release" for the full runbook. To release without
# Actions, run GoReleaser locally instead (same README section).
name: release

on:
  push:
    tags:
      - 'v*'
  # build-snapshot below runs on a pull request that touches THIS file, and
  # nothing else does: the real goreleaser job stays off (see its `if`), so a
  # pull request proves the GoReleaser config builds and signs nothing. Added
  # 2026-09-02 after tokenfuse's v0.4.2 failed on both Linux runners the
  # first time its own tag-only release.yml ever reached its musl leg: a
  # workflow gated on `push: tags: v*` alone is tested by exactly one event
  # in its whole life, and that event is the one where a mistake is public.
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  goreleaser:
    # Never on a pull request: this job signs with the real GPG key and
    # publishes a GitHub release the Terraform Registry ingests. build-snapshot
    # below is what a pull request runs instead.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  # Proves the same .goreleaser.yml cross-compiles cleanly, without the GPG
  # key and without publishing anything: `build`, unlike `release`, never
  # reaches the signs: or release: stages, so this needs neither secret and
  # cannot sign or upload by construction rather than by a flag somebody has
  # to remember.
  build-snapshot:
    name: goreleaser build --snapshot
    # Only on the pull request that exercises this file: the real goreleaser
    # job above already covers a tag push, and running both there would
    # cross-compile the whole matrix twice for nothing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser (snapshot build, no publish, no signing)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: build --snapshot --clean
