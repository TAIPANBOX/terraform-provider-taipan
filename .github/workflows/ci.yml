name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: dependency list is pinned
        run: ./scripts/deps-tight.sh
      - name: the committed docs are what the schema generates
        run: ./scripts/docs-generated.sh
      - name: every scenario is held by a test
        run: ./scripts/scenarios-have-tests.sh
      - name: the README's own figures are true
        run: ./scripts/readme-numbers.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that starts writing into the checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -quiet ./...

  # TF_ACC-gated acceptance tests (TestAccBudgetResource,
  # TestAccWardryxPolicyResource) against real, disposable TokenFuse Cloud
  # and Wardryx instances built from sibling checkouts in this same job --
  # all three TAIPANBOX repos are public, so no cross-repo secret/PAT is
  # needed. See scripts/testacc-local.sh, which this job runs unmodified
  # (the same entry point a contributor uses locally).
  acceptance:
    name: acceptance tests (live TokenFuse Cloud + Wardryx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: terraform-provider-taipan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/tokenfuse
          path: tokenfuse
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/wardryx
          path: wardryx
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: terraform-provider-taipan/go.sum
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tokenfuse
      - name: Run acceptance tests
        working-directory: terraform-provider-taipan
        env:
          TOKENFUSE_REPO_DIR: ${{ github.workspace }}/tokenfuse
          WARDRYX_REPO_DIR: ${{ github.workspace }}/wardryx
        run: ./scripts/testacc-local.sh
